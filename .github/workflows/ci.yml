name: PD3board CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pytest Suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (GitHub Actions)
        if: github.server_url == 'https://github.com'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Python 3.11 (Forgejo Debian Bookworm Runner)
        if: github.server_url != 'https://github.com'
        run: |
          if ! python3 -c "import ensurepip" >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3-venv python3-pip
          fi
          python3 -m venv /tmp/ci-venv
          echo "/tmp/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: PYTHONPATH=. pytest tests/test_*.py -v
